name: Deploy

on:
  push:
    branches: 
      - deploy
      - public-main
      - working_local   # <-- add this line
  pull_request:
    branches: 
      - deploy
      - public-main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SATELLITE_ID_DEVELOPMENT: ${{ secrets.SATELLITE_ID_DEVELOPMENT }}
      SATELLITE_ID_PRODUCTION: ${{ secrets.SATELLITE_ID_PRODUCTION }}
      NODE_ENV: ${{ github.ref == 'refs/heads/deploy' && 'production' || 'development' }}
      JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
      
    outputs:
      build_status: ${{ steps.build.outputs.status }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Clean npm cache
        run: npm cache clean --force
          
      - name: Install dependencies
        id: install
        run: |
          echo "::group::NPM Installation"
          # Install all dependencies including dev dependencies
          NODE_ENV=development npm install --include=dev
          
          # Verify installation immediately
          if [ ! -d "node_modules/typescript" ]; then
            echo "Missing typescript, installing explicitly..."
            npm install typescript --save-dev
          fi
          if [ ! -d "node_modules/@types/react" ]; then
            echo "Missing @types/react, installing explicitly..."
            npm install @types/react --save-dev
          fi
          if [ ! -d "node_modules/@types/node" ]; then
            echo "Missing @types/node, installing explicitly..."
            npm install @types/node --save-dev
          fi
          
          # Now verify all critical dependencies are installed
          MISSING_DEPS=0
          if [ ! -d "node_modules/typescript" ]; then
            echo "::error::Missing typescript"
            MISSING_DEPS=1
          fi
          if [ ! -d "node_modules/@types/react" ]; then
            echo "::error::Missing @types/react"
            MISSING_DEPS=1
          fi
          if [ ! -d "node_modules/@types/node" ]; then
            echo "::error::Missing @types/node"
            MISSING_DEPS=1
          fi
          
          if [ $MISSING_DEPS -eq 1 ]; then
            echo "::error::Critical TypeScript dependencies are still missing after explicit installation"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "All critical dependencies verified"
          echo "status=success" >> $GITHUB_OUTPUT
          
          # Log installation results (don't fail on logging errors)
          echo "::group::Installation Results"
          echo "Installed packages:"
          npm ls --all > npm-list.log 2>&1 || true
          echo "Node modules count:"
          ls node_modules | wc -l | tee -a npm-list.log
          echo "Critical dependencies:"
          npm ls typescript @types/react @types/node --depth=0 2>&1 | tee -a npm-list.log || true
          echo "::endgroup::"
          
      - name: Upload npm logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: |
            npm-install.log
            npm-list.log
          
      - name: Build application
        id: build
        if: steps.install.outputs.status != 'failed'
        run: |
          # Ensure Next.js has access to all dependencies during build
          export NODE_ENV=development
          
          echo "::group::Next.js Build"
          npm run build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Build failed - check build.log artifact for details"
          fi
        env:
          NEXT_PUBLIC_SATELLITE_ID: ${{ github.ref == 'refs/heads/deploy' && secrets.SATELLITE_ID_PRODUCTION || secrets.SATELLITE_ID_DEVELOPMENT }}
          
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          
      - name: Deploy to Internet Computer
        if: always()
        uses: junobuild/juno-action@main
        with:
          args: deploy ${{ github.ref == 'refs/heads/deploy' && '--network ic' || '--network local' }}
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}