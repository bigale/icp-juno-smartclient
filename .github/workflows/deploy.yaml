name: Deploy

on:
  push:
    branches: 
      - deploy
      - public-main
  pull_request:
    branches: 
      - deploy
      - public-main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SATELLITE_ID_DEVELOPMENT: ${{ secrets.SATELLITE_ID_DEVELOPMENT }}
      SATELLITE_ID_PRODUCTION: ${{ secrets.SATELLITE_ID_PRODUCTION }}
      NODE_ENV: ${{ github.ref == 'refs/heads/deploy' && 'production' || 'development' }}
      JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
      
    outputs:
      build_status: ${{ steps.build.outputs.status }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Clean npm cache
        run: npm cache clean --force
          
      - name: Install dependencies
        id: install
        run: |
          echo "::group::NPM Installation"
          # Force install all dependencies including devDependencies
          npm ci --include=dev 2>&1 | tee npm-install.log
          echo "::endgroup::"
          
          echo "::group::Dependency information"
          echo "Installed packages:"
          npm ls --all > npm-list.log 2>&1
          
          echo "Node modules count:"
          node -e "console.log('node_modules files:', require('fs').readdirSync('node_modules').length)" | tee -a npm-list.log
          
          echo "Critical dependencies:"
          npm ls typescript @types/react @types/node --all 2>&1 | tee -a npm-list.log
          
          echo "Package locations:"
          ls -la node_modules/typescript node_modules/@types/react node_modules/@types/node 2>&1 | tee -a npm-list.log
          echo "::endgroup::"
          
          # More detailed dependency check
          if [ ! -d "node_modules/typescript" ] || [ ! -d "node_modules/@types/react" ] || [ ! -d "node_modules/@types/node" ]; then
            echo "::error::One or more critical TypeScript dependencies are missing:"
            [ ! -d "node_modules/typescript" ] && echo "::error::Missing typescript"
            [ ! -d "node_modules/@types/react" ] && echo "::error::Missing @types/react"
            [ ! -d "node_modules/@types/node" ] && echo "::error::Missing @types/node"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          
      - name: Upload npm logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: |
            npm-install.log
            npm-list.log
          
      - name: Build application
        id: build
        if: steps.install.outputs.status != 'failed'
        run: |
          # Ensure Next.js has access to all dependencies during build
          export NODE_ENV=development
          
          echo "::group::Next.js Build"
          npm run build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Build failed - check build.log artifact for details"
          fi
        env:
          NEXT_PUBLIC_SATELLITE_ID: ${{ github.ref == 'refs/heads/deploy' && secrets.SATELLITE_ID_PRODUCTION || secrets.SATELLITE_ID_DEVELOPMENT }}
          
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          
      - name: Deploy to Internet Computer
        if: steps.build.outputs.status == 'success'
        uses: junobuild/juno-action@main
        with:
          args: deploy ${{ github.ref == 'refs/heads/deploy' && '--network ic' || '--network local' }}
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}