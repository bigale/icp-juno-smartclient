name: Deploy

on:
  push:
    branches: 
      - deploy
      - public-main
  pull_request:
    branches: 
      - deploy
      - public-main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SATELLITE_ID_DEVELOPMENT: ${{ secrets.SATELLITE_ID_DEVELOPMENT }}
      SATELLITE_ID_PRODUCTION: ${{ secrets.SATELLITE_ID_PRODUCTION }}
      NODE_ENV: ${{ github.ref == 'refs/heads/deploy' && 'production' || 'development' }}
      JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
      NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'
          
      - name: Setup npm
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set legacy-peer-deps true
          npm config list
          
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --verbose --no-audit
          # Install critical @dfinity dependencies explicitly
          npm install @dfinity/auth-client @dfinity/utils @dfinity/identity --save
          npm ls typescript @types/react @types/node || true
          node -e "console.log('node_modules files:', require('fs').readdirSync('node_modules').length)"
          
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SATELLITE_ID: ${{ github.ref == 'refs/heads/deploy' && secrets.SATELLITE_ID_PRODUCTION || secrets.SATELLITE_ID_DEVELOPMENT }}
          
      - name: Deploy to Internet Computer
        uses: junobuild/juno-action@main
        with:
          args: deploy ${{ github.ref == 'refs/heads/deploy' && '--network ic' || '--network local' }}
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}